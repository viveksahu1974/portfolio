<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Vivek Sahu | AI, Cybersecurity and Creative Technology</title>
<desc id="desc">A futuristic black and neon-green developer banner for Vivek Sahu.</desc>
<defs>
